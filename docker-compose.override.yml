# Development-Overrides: hot-reload für backend und frontend
# Wird automatisch von docker compose up geladen
services:
  api:
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    volumes:
      - ./backend:/app
    command: >
      celery -A app.tasks.celery_app worker
             -B --loglevel=debug -Q default,streams,segments --concurrency=1
