# Dev-Overrides: hot-reload, direkte Ports, kein nginx
# Wird automatisch von docker compose up geladen
services:
  api:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    volumes:
      - ./backend:/app
    command: >
      celery -A app.tasks.celery_app worker
             -B --loglevel=debug -Q default,streams --concurrency=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_POLL_INTERVAL=500
