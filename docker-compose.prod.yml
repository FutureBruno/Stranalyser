# Produktions-Overrides: nginx als Reverse Proxy, kein hot-reload
# Starten mit: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - stranalyser_net
