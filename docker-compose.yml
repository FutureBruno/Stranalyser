services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stranalyser
      POSTGRES_USER: stranalyser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stranalyser_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stranalyser"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - stranalyser_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stranalyser:${DB_PASSWORD}@db:5432/stranalyser
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stranalyser_net
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stranalyser:${DB_PASSWORD}@db:5432/stranalyser
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stranalyser_net
    command: >
      celery -A app.tasks.celery_app worker
             -B
             --loglevel=info
             -Q default,streams
             --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - stranalyser_net

networks:
  stranalyser_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
